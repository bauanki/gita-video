name: Gita Daily
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core libraqm0
          pip install moviepy requests edge-tts
      - run: python script.py
      - name: Save video
        run: |
          D=$(date +%F)
          mkdir -p videos
          cp output.mp4 videos/$D.mp4
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add videos
          git commit -m "video $D"
          git push
          echo "VIDEO_NAME=$D" >> $GITHUB_ENV
      - run: python post.py
        env:
          IG_ID: ${{ secrets.IG_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
